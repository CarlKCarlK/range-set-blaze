# The CUDA kernels behind `Engine::CudaOnly`, written in Rust and compiled to PTX with cuda-oxide.
# Not part of the range-set-blaze build: run `./build-ptx.sh` here to regenerate
# `../src/gpu/cuda_kernels.ptx`, which the `cuda` feature loads at run time.
[package]
name = "cuda_kernels"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
cuda-device = { git = "https://github.com/NVIDIA/cuda-rust.git", rev = "ad0a42c8e5a161ca850ec819cdc7e90e9a88809a" }
cuda-host = { git = "https://github.com/NVIDIA/cuda-rust.git", rev = "ad0a42c8e5a161ca850ec819cdc7e90e9a88809a" }
cuda-core = { git = "https://github.com/NVIDIA/cuda-rust.git", rev = "ad0a42c8e5a161ca850ec819cdc7e90e9a88809a" }
